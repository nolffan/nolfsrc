# The public archives of every build variant, as workflow artifacts (each
# the .tar.gz itself, not a zip around it):
# out/nolf-{legacy,modern}-{release,debug}-public.tar.gz (build/package.sh),
# the game directory without anything from the discs, with the scripts that
# install that from the player's own disc images (build/mkinstall.py). The
# -private archives, which hold the retail data, are not made here. The
# release build is also checked for byte regressions (make progress).
#
# The build needs the two redump images of the Game of the Year discs
# (ext/rez/fetch-isos.sh nolf-eu-goty: 0.8 GB of zips from archive.org). The
# job "prepare" fetches them once, into a cache keyed on
# ext/rez/isos/SHA256SUMS, and builds the docker image into a layer cache; then
# the four builds run at the same time, each in a job of its own that
# restores both and installs the retail game from the zips. None of the
# builds needs another's output.
#
# Pushing a tag (v*, e.g. v0.0.3-alpha) also makes a GitHub release of it,
# with the modern build's public archives attached (the job "release"),
# named for the tag: nolf-modern-release-public.tar.gz as
# nolfsrc-<tag>.tar.gz and nolf-modern-debug-public.tar.gz as
# nolfsrc-debug-<tag>.tar.gz, each repacked to unpack to a directory of
# that name. A
# tag with a hyphen in it is marked a pre-release. A release of that tag
# made by hand beforehand is kept, with its text; the archives are added to
# it, replacing ones of the same name. A new release's text is
# .github/release_notes.md, followed by GitHub's generated list of changes.
#
# A push to master whose four builds pass updates the pre-release "nightly"
# the same way: the tag nightly is moved to the commit, its archives are
# replaced by the commit's -- named for it, nolfsrc-nightly-<commit>.tar.gz
# and nolfsrc-debug-nightly-<commit>.tar.gz (the first 7 digits of the
# hash), each unpacking to a directory of that name, so a download and an
# install say what they were built from -- and the text is
# .github/nightly_notes.md (the commit and date) followed by
# release_notes.md. The new archives go up before the old ones are deleted.
# It is edited in place, not made anew, so its page stays the same and
# watchers are not notified of every merge, and it is never marked the
# latest release. A run whose commit is no longer master's head (one re-run
# later, say) leaves it alone.
name: Public archives

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: public-archives-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      discs-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      # .gitmodules names the submodules by SSH; all of them are public, so
      # fetch them over HTTPS instead, at the commit this one records. Only
      # ext/rez/ (the disc list and fetch-isos.sh) is needed here.
      - name: Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --depth 1 ext/rez

      # hashFiles() sees only the checkout, so the key is made once the
      # submodule is there, and handed to the builds.
      - name: Cache key
        id: key
        run: echo "key=redump-nolf-eu-goty-$(sha256sum ext/rez/isos/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"

      # Only whether the cache has them: nothing is downloaded on a hit.
      - name: Look for the disc images
        id: discs
        uses: actions/cache/restore@v4
        with:
          path: ext/rez/isos/*.zip
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # Checked against SHA256SUMS before it is saved.
      - name: Fetch the disc images
        if: steps.discs.outputs.cache-hit != 'true'
        run: ext/rez/fetch-isos.sh nolf-eu-goty

      - name: Save the disc images
        if: steps.discs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ext/rez/isos/*.zip
          key: ${{ steps.key.outputs.key }}

      # Written to the layer cache here, once; the builds only read it.
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: nolfsrc-build
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false         # one build failing still lets the others finish
      matrix:
        include:
          - name: nolf-legacy-release
            target: all
          - name: nolf-legacy-debug
            target: debug
          - name: nolf-modern-release
            target: modern
          - name: nolf-modern-debug
            target: modern-debug
    name: ${{ matrix.name }}
    env:
      NOLF_ARCHIVES: public
      IMAGE_BUILD: 0           # the step "Build image" loads it, cached
    steps:
      - uses: actions/checkout@v4

      - name: Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --depth 1 --jobs 4

      - name: Restore the disc images
        uses: actions/cache/restore@v4
        with:
          path: ext/rez/isos/*.zip
          key: ${{ needs.prepare.outputs.discs-key }}
          fail-on-cache-miss: true

      # Loaded as nolfsrc-build, which the Makefile then uses (IMAGE_BUILD=0).
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: nolfsrc-build
          load: true
          cache-from: type=gha

      # Checks the zips against SHA256SUMS, then installs the retail game.
      - name: Install the retail game
        run: make retail

      - name: Build ${{ matrix.name }}
        run: make ${{ matrix.target }}

      # The release build scored against the retail binaries: fails if a
      # function recorded in progress/identical.txt is no longer
      # byte-identical (build/progress.sh; without NOLF_SOURCE, so the
      # lithshared libraries are not scored).
      - name: Byte regressions (make progress)
        if: matrix.name == 'nolf-legacy-release'
        run: make progress

      # Uploaded as the .tar.gz itself (archive: false), not zipped again;
      # the artifact takes the file's name.
      - uses: actions/upload-artifact@v7
        with:
          path: out/${{ matrix.name }}-public.tar.gz
          archive: false
          if-no-files-found: error

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write          # create the release and upload to it
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      # Each by its name: the build jobs upload the .tar.gz itself
      # (archive: false), which download-artifact reads from v8 on.
      - uses: actions/download-artifact@v8
        with:
          name: nolf-modern-release-public.tar.gz
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: nolf-modern-debug-public.tar.gz
          path: dist

      - name: Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
        run: |
          # The archives' names after nolfsrc-: the tag, or for the nightly
          # the commit it was built from.
          ARCHIVE="$TAG"
          if [ "$TAG" = nightly ]; then ARCHIVE="nightly-${SHA:0:7}"; fi

          find dist -type f -ls
          notes() {   # the release text for $TAG, into notes.md
            sed -e "s|{{TAG}}|$TAG|g" -e "s|{{ARCHIVE}}|$ARCHIVE|g" -e "s|{{REPO}}|$GH_REPO|g" \
                .github/release_notes.md | sed '/^<!--/,/^-->/d' > body.md
            if [ "$TAG" = nightly ]; then
              sed -e "s|{{SHA}}|$SHA|g" -e "s|{{SHORT}}|${SHA:0:7}|g" \
                  -e "s|{{REPO}}|$GH_REPO|g" -e "s|{{DATE}}|$(date -u '+%Y-%m-%d %H:%M UTC')|g" \
                  .github/nightly_notes.md | cat - body.md > notes.md
            else
              mv body.md notes.md
            fi
          }
          if [ "$TAG" = nightly ]; then
            head="$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq .object.sha)"
            if [ "$head" != "$SHA" ]; then
              echo "master is at $head now, not $SHA: the nightly is left as it is"
              exit 0
            fi
            notes
            if gh release view nightly >/dev/null 2>&1; then
              # Moved, or made again if it was deleted by hand.
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
                  -f sha="$SHA" -F force=true >/dev/null ||
                gh api -X POST "repos/$GH_REPO/git/refs" \
                    -f ref=refs/tags/nightly -f sha="$SHA" >/dev/null
              gh release edit nightly --prerelease --latest=false \
                  --title "Nightly (${SHA:0:7})" --notes-file notes.md
            else
              gh release create nightly --target "$SHA" --prerelease --latest=false \
                  --title "Nightly (${SHA:0:7})" --notes-file notes.md
            fi
          elif ! gh release view "$TAG" >/dev/null 2>&1; then
            pre=; case "$TAG" in *-*) pre=--prerelease ;; esac
            notes
            gh release create "$TAG" --verify-tag --notes-file notes.md \
                --generate-notes $pre --title "$TAG"
          fi
          # Repacked so that each unpacks to a directory of its own name,
          # not the build's nolf-modern-release/ or nolf-modern-debug/.
          repack() {   # <build name> <release name>
            rm -rf x && mkdir x
            tar -C x -xzpf "$(find dist -name "$1-public.tar.gz")"
            mv "x/$1" "x/$2"
            tar -C x -cf - "$2" | gzip -6 > "up/$2.tar.gz"
          }
          mkdir up
          repack nolf-modern-release "nolfsrc-$ARCHIVE"
          repack nolf-modern-debug "nolfsrc-debug-$ARCHIVE"
          for f in up/*.tar.gz; do echo "$f: $(tar -tzf "$f" | head -1)"; done
          gh release upload "$TAG" up/*.tar.gz --clobber
          # The nightly keeps only this commit's archives, deleted once the
          # new ones are up so the page is never without a download.
          if [ "$TAG" = nightly ]; then
            gh release view nightly --json assets --jq '.assets[].name' |
              while read -r a; do
                case "$a" in nolfsrc-nightly-${SHA:0:7}.tar.gz|nolfsrc-debug-nightly-${SHA:0:7}.tar.gz) ;;
                  *) echo "deleting $a"; gh release delete-asset nightly "$a" --yes < /dev/null ;;
                esac
              done
          fi
